---

x-common-settings:
  &common-settings
  image: freqtradeorg/freqtrade:stable
  # build:
  #   context: .
  #   dockerfile: "./docker/Dockerfile.custom"
  restart: unless-stopped
  volumes:
    - "./user_data:/freqtrade/user_data"
    - "./user_data/data:/freqtrade/user_data/data"
    - "./configs:/freqtrade/configs"
    - "./NostalgiaForInfinityX8.py:/freqtrade/NostalgiaForInfinityX8.py"
    - "./NostalgiaForInfinityX8_Combined.py:/freqtrade/NostalgiaForInfinityX8_Combined.py"
    - "./NostalgiaForInfinityX8_ShortSignals.py:/freqtrade/NostalgiaForInfinityX8_ShortSignals.py"
    - "./${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}.py:/freqtrade/${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}.py"
    - "./NostalgiaForInfinityX8.py:/freqtrade/user_data/strategies/NostalgiaForInfinityX8.py"
    - "./NostalgiaForInfinityX8_Combined.py:/freqtrade/user_data/strategies/NostalgiaForInfinityX8_Combined.py"
    - "./NostalgiaForInfinityX8_ShortSignals.py:/freqtrade/user_data/strategies/NostalgiaForInfinityX8_ShortSignals.py"
    - "./${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}.py:/freqtrade/user_data/strategies/${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}.py"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}"]
    interval: 1m30s
    timeout: 10s
    retries: 3
    start_period: 40s
    start_interval: 5s
  env_file:
    - path: .env
      required: false # default true

services:

  freqtrade:
    <<: *common-settings
    container_name: ${FREQTRADE__BOT_NAME:-Example_Test_Account}_${FREQTRADE__EXCHANGE__NAME:-binance}_${FREQTRADE__TRADING_MODE:-futures}-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}
    ports:
      - "${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}:${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}"
    # Default command used when running `docker compose up`
    command: >
      trade
      --db-url sqlite:////freqtrade/user_data/${FREQTRADE__BOT_NAME:-Example_Test_Account}_${FREQTRADE__EXCHANGE__NAME:-binance}_${FREQTRADE__TRADING_MODE:-futures}-tradesv3.sqlite
      --log-file user_data/logs/${FREQTRADE__BOT_NAME:-Example_Test_Account}-${FREQTRADE__EXCHANGE__NAME:-binance}-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX8}-${FREQTRADE__TRADING_MODE:-futures}.log
      --strategy-path .
      -v
