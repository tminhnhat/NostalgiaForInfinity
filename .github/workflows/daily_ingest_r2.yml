name: Daily Binance Vision Data Ingestion to Cloudflare R2

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to fetch'
        required: false
        default: '2'

jobs:
  ingest_and_sync:
    name: Ingest Candles & Sync to R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow fastparquet

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone for Cloudflare R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
        run: |
          mkdir -p ~/.config/rclone
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${ENDPOINT}
          region = ${R2_REGION}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf
          echo "✅ Rclone configured for Cloudflare R2 endpoint: ${ENDPOINT}"

      - name: Pull Existing Data from Cloudflare R2 (Incremental Sync Cache)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.R2_BUCKET_NAME || 'goclaw-data' }}
        run: |
          mkdir -p user_data/data/binance
          echo "Pulling existing parquet files from r2:${R2_BUCKET}/binance..."
          rclone sync "r2:${R2_BUCKET}/binance" user_data/data/binance --fast-list -v || true

      - name: Ingest Candles from Binance Vision & Convert to Parquet
        env:
          FETCH_DAYS: ${{ github.event.inputs.days || '2' }}
        run: |
          python scripts/ingest_binance_to_r2.py \
            --config configs/r2_sync_pairs.json \
            --output-dir user_data/data/binance \
            --days $FETCH_DAYS

      - name: Sync Updated Candles to Cloudflare R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.R2_BUCKET_NAME || 'goclaw-data' }}
        run: |
          echo "Syncing updated parquet candles to Cloudflare R2 (${R2_BUCKET})..."
          rclone sync user_data/data/binance "r2:${R2_BUCKET}/binance" \
            --fast-list \
            --transfers=8 \
            --checksum \
            -v

      - name: Ingestion Health Check Summary
        run: |
          echo "### 📊 Daily Binance Vision Ingestion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time (UTC)**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Processed**: $(find user_data/data/binance -name '*.parquet' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Size**: $(du -sh user_data/data/binance | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully synced to Cloudflare R2 bucket." >> $GITHUB_STEP_SUMMARY
