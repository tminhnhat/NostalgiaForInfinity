name: Daily Ingestion & Backtest Runner

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of rolling days to evaluate'
        required: false
        default: '180'
      strategy:
        description: 'Strategy to evaluate'
        required: false
        default: 'NostalgiaForInfinityX8_Combined_AI'
      version:
        description: 'Strategy version tag (leave empty to auto-detect from Git)'
        required: false
        default: ''
      run_label:
        description: 'Custom run marker/label for comparison (e.g., v7.2-daily-eval)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest_and_backtest:
    name: Download Candles, Backtest on GitHub Runner & Publish Report
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine Version & Backtest Run Context
        id: meta
        run: |
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || git describe --tags --always 2>/dev/null || echo "v7.2")
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null | tr -d '\n' || echo "daily backtest")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$GIT_TAG"
          fi

          LABEL="${{ github.event.inputs.run_label }}"
          if [ -z "$LABEL" ]; then
            LABEL="${VERSION}-run-${{ github.run_number }}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "run_label=${LABEL}" >> $GITHUB_OUTPUT
          echo "run_url=${RUN_URL}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "📋 Context resolved: Version=${VERSION}, Label=${LABEL}, SHA=${SHORT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install TA-Lib C Library
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install TA-Lib freqtrade pyarrow fastparquet pandas lightgbm joblib scikit-learn

      - name: Cache Binance Candles Data
        uses: actions/cache@v4
        with:
          path: user_data/data/binance
          key: binance-candles-${{ runner.os }}-${{ hashFiles('configs/backtest_config.json') }}-${{ github.run_id }}
          restore-keys: |
            binance-candles-${{ runner.os }}-${{ hashFiles('configs/backtest_config.json') }}-
            binance-candles-${{ runner.os }}-

      - name: Download Target Candles from Binance Vision
        run: |
          python scripts/download_candles.py \
            --config configs/backtest_config.json \
            --days ${{ github.event.inputs.days || 180 }} \
            --output-dir user_data/data/binance \
            --workers 24 \
            --skip-existing

      - name: Apply Offline Markets Patch (Bypass US IP 451)
        run: |
          python scripts/patch_offline_markets.py

      - name: Execute Freqtrade Backtest on Runner & Export Report
        run: |
          python scripts/run_eval_backtest.py \
            --config configs/backtest_config.json \
            --strategy ${{ github.event.inputs.strategy || 'NostalgiaForInfinityX8_Combined_AI' }} \
            --days ${{ github.event.inputs.days || 180 }} \
            --version "${{ steps.meta.outputs.version }}" \
            --commit-sha "${{ steps.meta.outputs.short_sha }}" \
            --run-label "${{ steps.meta.outputs.run_label }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ steps.meta.outputs.run_url }}"

      - name: Publish Step Summary to GitHub Actions UI
        if: always()
        run: |
          if [ -f reports/latest_report.md ]; then
            cat reports/latest_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Backtest & Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}-run${{ github.run_number }}
          path: |
            reports/
            user_data/backtest_results/
          retention-days: 30

      - name: Publish Evaluation Report to eval/daily-report branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B eval/daily-report
          git add reports/history/ reports/latest_report.md reports/latest_trades.csv reports/tag_analysis_report.md reports/full_trade_journal_200usd.md

          if git diff --staged --quiet; then
            echo "No changes in performance reports to commit."
          else
            git commit -m "chore(eval): backtest report for ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }}) [run #${{ github.run_number }}]"
            git push origin eval/daily-report --force
            echo "✅ Successfully published latest report to eval/daily-report branch."
          fi
