name: Daily Ingestion & Backtest Runner

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of rolling days to evaluate'
        required: false
        default: '30'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest_and_backtest:
    name: Download Candles, Backtest on GitHub Runner & Publish Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache TA-Lib C Library
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: |
            /usr/include/ta-lib
            /usr/lib/libta_lib*
          key: talib-c-v0.4.0

      - name: Compile and Install TA-Lib C Library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install TA-Lib freqtrade pyarrow fastparquet pandas

      - name: Download Target Candles from Binance Vision
        run: |
          python scripts/download_candles.py \
            --config configs/eval_pairs.json \
            --days ${{ github.event.inputs.days || 30 }} \
            --output-dir user_data/data/binance \
            --workers 16

      - name: Apply Offline Markets Patch (Bypass US IP 451)
        run: |
          python scripts/patch_offline_markets.py

      - name: Execute Freqtrade Backtest on Runner & Export Report
        run: |
          python scripts/run_eval_backtest.py \
            --strategy NostalgiaForInfinityX8 \
            --days ${{ github.event.inputs.days || 30 }}

      - name: Publish Evaluation Report to eval/daily-report branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B eval/daily-report
          git add reports/history/ reports/latest_report.md

          if git diff --staged --quiet; then
            echo "No changes in performance reports to commit."
          else
            git commit -m "chore(eval): automated daily backtest report [$(date -u +'%Y-%m-%d')]"
            git push origin eval/daily-report --force
            echo "✅ Successfully published latest report to eval/daily-report branch."
          fi
