name: Hermes Senior Quant Risk Peer Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
  workflow_run:
    workflows: ["Google Jules Task Runner - Optimization Agent", "Jules Optimizer Agent Setup"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to review'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hermes_risk_review:
    name: Review Jules Commits for Overfitting & Tail Risk
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/jules-proposal-')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Determine PR and Target Branch
        id: target
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "ref=" >> $GITHUB_OUTPUT
          else
            LATEST_PR=$(gh pr list --state open --limit 1 --json number,headRefName --jq '.[0]')
            PR_NUM=$(echo "$LATEST_PR" | jq -r '.number // empty')
            PR_REF=$(echo "$LATEST_PR" | jq -r '.headRefName // empty')
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "ref=$PR_REF" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref || github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hermes to Inspect Jules Commit and Post Review
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.1-pro"
        run: |
          echo "Hermes reading Jules' commit on PR #${PR_NUMBER}..."
          python scripts/hermes_peer_reviewer.py --pr-number "${PR_NUMBER}"
