name: PR Interaction & OOS Validation Loop

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  handle_approval:
    name: Execute OOS Validation on /approve-upgrade
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/approve-upgrade') &&
      !contains(github.event.comment.body, 'Out-Of-Sample') &&
      !contains(github.event.comment.body, 'Senior Quant Risk Officer')
    runs-on: ubuntu-latest

    steps:
      - name: Verify Maintainer Authorization & Prevent Recursion
        id: check_auth
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "Triggered by: $COMMENT_USER"
          if [[ "$COMMENT_BODY" == *"Out-Of-Sample"* ]] || [[ "$COMMENT_BODY" == *"Senior Quant Risk Officer"* ]]; then
            echo "::notice::Detected automated audit report containing command keyword. Aborting to prevent recursion."
            exit 0
          fi
          if [ "$COMMENT_USER" != "$REPO_OWNER" ] && [ "$COMMENT_USER" != "tminhnhat" ]; then
            echo "::error::Unauthorized user tried to trigger /approve-upgrade"
            exit 1
          fi
          echo "✅ Maintainer authorized."

      - name: Acknowledge Command with Rocket Emoji Reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch PR Details
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          gh pr checkout "$PR_NUM"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Out-Of-Sample Validation
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/oos_validator.py --pr-number ${{ steps.pr_info.outputs.pr_number }}
