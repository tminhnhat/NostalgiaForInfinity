name: Google Jules Task Runner - Optimization Agent

on:
  push:
    branches:
      - eval/daily-report
    paths:
      - 'reports/latest_report.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  jules_task_optimize:
    name: Run Google Jules Agent Task (Evaluated with Gemini 3.1 Pro)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout eval/daily-report branch
        uses: actions/checkout@v4
        with:
          ref: eval/daily-report
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Execute Jules Task Runner
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.1-pro"
        run: |
          python scripts/jules_optimizer.py

      - name: Upload Jules Task & Proposal Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-task-artifacts
          path: |
            reports/jules_pr_proposal.md
            reports/jules_task_session.json
          if-no-files-found: ignore
