name: Jules Optimizer Agent Setup

on:
  push:
    branches:
      - eval/daily-report
    paths:
      - 'reports/latest_report.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  jules_analyze_and_propose:
    name: Run Jules Alpha Decay Analysis & Propose Upgrade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout eval/daily-report branch
        uses: actions/checkout@v4
        with:
          ref: eval/daily-report
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Jules Optimizer
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/jules_optimizer.py

      - name: Upload Proposal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-proposal-summary
          path: reports/jules_pr_proposal.md
          if-no-files-found: ignore
